<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title id="t">Polarity architecture</title>
  <desc id="d">The bench computer does continuous perception on the edge (camera, ArUco board warp, quality gate, motion, LED detector) and calls Nebius Token Factory (Nemotron models) only when the student presses Check or asks a question. Tavily is used for part lookups.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
    <style>
      .box { fill: #18212D; stroke: #243041; stroke-width: 1.5; }
      .edge { fill: #0F2A2A; stroke: #2DD4BF; stroke-width: 1.5; }
      .cloud { fill: #2A1F0C; stroke: #F59E0B; stroke-width: 1.5; }
      .h { fill: #E6EDF3; font-size: 15px; font-weight: 700; }
      .s { fill: #8B98A9; font-size: 12.5px; }
      .tag { fill: #2DD4BF; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
      .ctag { fill: #F59E0B; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
      .line { stroke: #8B98A9; stroke-width: 1.6; fill: none; }
      .cline { stroke: #F59E0B; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="780" rx="18" fill="#0B0F14"/>

  <!-- Bench computer -->
  <rect x="20" y="20" width="830" height="740" rx="16" fill="#111821" stroke="#243041"/>
  <text x="44" y="52" class="tag">BENCH COMPUTER (EDGE) · RUNS CONTINUOUSLY, NO CLOUD COST</text>

  <rect x="44" y="72" width="180" height="62" rx="10" class="edge"/>
  <text x="62" y="98" class="h">USB camera</text>
  <text x="62" y="118" class="s">25–35 cm above the board</text>

  <rect x="264" y="72" width="330" height="62" rx="10" class="edge"/>
  <text x="282" y="98" class="h">CameraService</text>
  <text x="282" y="118" class="s">OpenCV thread · sharpest frame of last 1 s · MJPEG</text>
  <path d="M224 103 H258" class="line" marker-end="url(#ah)"/>

  <rect x="264" y="166" width="330" height="62" rx="10" class="edge"/>
  <text x="282" y="192" class="h">BoardLocator</text>
  <text x="282" y="212" class="s">ArUco mat → homography → 1024×768 top-down warp</text>
  <path d="M429 134 V160" class="line" marker-end="url(#ah)"/>

  <rect x="44" y="262" width="180" height="62" rx="10" class="edge"/>
  <text x="62" y="288" class="h">QualityGate</text>
  <text x="62" y="308" class="s">focus · light · glare · board</text>
  <rect x="244" y="262" width="180" height="62" rx="10" class="edge"/>
  <text x="262" y="288" class="h">MotionMonitor</text>
  <text x="262" y="308" class="s">steady before checking</text>
  <rect x="444" y="262" width="180" height="62" rx="10" class="edge"/>
  <text x="462" y="288" class="h">LedDetector</text>
  <text x="462" y="308" class="s">physical power-test truth</text>
  <rect x="644" y="262" width="180" height="62" rx="10" class="edge"/>
  <text x="662" y="288" class="h">Snapshot store</text>
  <text x="662" y="308" class="s">checked frame only</text>
  <path d="M429 228 V245 M134 245 H734" class="line"/>
  <path d="M134 245 V256" class="line" marker-end="url(#ah)"/><path d="M334 245 V256" class="line" marker-end="url(#ah)"/><path d="M534 245 V256" class="line" marker-end="url(#ah)"/><path d="M734 245 V256" class="line" marker-end="url(#ah)"/>

  <rect x="190" y="360" width="490" height="62" rx="10" class="box"/>
  <text x="208" y="386" class="h">SessionEngine</text>
  <text x="208" y="406" class="s">state machine · deterministic decision policy · hint ladder · escalation</text>
  <path d="M134 324 V340 H734 V324 M429 340 V354" class="line" marker-end="url(#ah)"/>

  <rect x="190" y="458" width="490" height="62" rx="10" class="box"/>
  <text x="208" y="484" class="h">ModelRouter</text>
  <text x="208" y="504" class="s">role → model ID · case policy · JSON mode · retries · budget guard · cost log</text>
  <path d="M435 422 V452" class="line" marker-end="url(#ah)"/>

  <rect x="44" y="556" width="370" height="96" rx="10" class="box"/>
  <text x="62" y="582" class="h">Browser UI (localhost)</text>
  <text x="62" y="604" class="s">Bench view · TA dashboard · Lab editor · Debug</text>
  <text x="62" y="624" class="s">mic → 16 kHz WAV · speechSynthesis + captions</text>
  <text x="62" y="644" class="s">FastAPI + WebSocket events</text>
  <rect x="444" y="556" width="380" height="96" rx="10" class="box"/>
  <text x="462" y="582" class="h">SQLite + local media</text>
  <text x="462" y="604" class="s">sessions · attempts · help queue · reports · costs</text>
  <text x="462" y="624" class="s">images stay on the bench (retention + purge)</text>
  <text x="462" y="644" class="s">hub mode: benches sync to the TA laptop</text>
  <path d="M300 520 V550" class="line" marker-end="url(#ah)"/><path d="M560 520 V550" class="line" marker-end="url(#ah)"/>

  <text x="44" y="700" class="s">Only when the student presses Check or asks a question does one perspective-corrected frame</text>
  <text x="44" y="720" class="s">(and an optional voice clip) leave the bench. A failing quality gate answers CAN'T TELL locally, for free.</text>

  <!-- Cloud -->
  <rect x="890" y="20" width="370" height="560" rx="16" fill="#111821" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="914" y="52" class="ctag">NEBIUS TOKEN FACTORY</text>
  <text x="914" y="72" class="s">OpenAI-compatible API · NVIDIA Nemotron 3</text>
  <rect x="914" y="92" width="322" height="100" rx="10" class="cloud"/>
  <text x="932" y="118" class="h">Nemotron 3 Nano Omni</text>
  <text x="932" y="140" class="s">perception: board photo + voice in one call</text>
  <text x="932" y="160" class="s">every Check / Ask · lab-sheet pages</text>
  <text x="932" y="180" class="s">JSON verdicts validated by Pydantic</text>
  <rect x="914" y="206" width="322" height="80" rx="10" class="cloud"/>
  <text x="932" y="232" class="h">Nemotron 3 Nano 30B</text>
  <text x="932" y="254" class="s">fast text: question intent, shortening</text>
  <text x="932" y="274" class="s">occasional, cheap</text>
  <rect x="914" y="300" width="322" height="80" rx="10" class="cloud"/>
  <text x="932" y="326" class="h">Nemotron 3 Super 120B</text>
  <text x="932" y="348" class="s">reasoning: TA triage · lab compiler · tools</text>
  <text x="932" y="368" class="s">per escalation</text>
  <rect x="914" y="394" width="322" height="80" rx="10" class="cloud"/>
  <text x="932" y="420" class="h">Nemotron 3 Ultra</text>
  <text x="932" y="442" class="s">deep: end-of-class report (thinking on)</text>
  <text x="932" y="462" class="s">about once per class · falls back to Super</text>
  <text x="914" y="510" class="s">Model IDs are discovered at runtime</text>
  <text x="914" y="530" class="s">(python -m polarity verify) and recorded</text>
  <text x="914" y="550" class="s">in data/capabilities.json.</text>

  <rect x="890" y="610" width="370" height="150" rx="16" fill="#111821" stroke="#243041"/>
  <text x="914" y="640" class="ctag">TAVILY SEARCH API</text>
  <text x="914" y="666" class="h">Part / datasheet lookup</text>
  <text x="914" y="688" class="s">runtime web search for pinouts (e.g. NE555)</text>
  <text x="914" y="708" class="s">Super summarises only those sources</text>
  <text x="914" y="728" class="s">citations shown to the student</text>

  <path d="M680 478 H850 V142 H908" class="cline" marker-end="url(#aa)"/>
  <path d="M680 500 H866 V680 H884" class="cline" marker-end="url(#aa)"/>
  <rect x="700" y="434" width="140" height="36" rx="8" fill="#0B0F14" stroke="#F59E0B" stroke-opacity="0.5"/>
  <text x="712" y="449" fill="#F59E0B" font-size="11px" font-weight="700">HTTPS · only on</text>
  <text x="712" y="464" fill="#F59E0B" font-size="11px" font-weight="700">Check / Ask</text>
</svg>
