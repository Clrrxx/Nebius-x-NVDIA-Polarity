# Per-model prices in USD per 1 million tokens, used ONLY for the budget guard and cost display.
#
# TEAM: copy the real prices from the Nebius Token Factory console pricing page
# (https://tokenfactory.nebius.com → Models / Pricing). Do NOT guess. While a price is null,
# the app shows the cost as "n/a" and the budget guard cannot stop spending for that model.
#
# Keys are the exact model IDs written to data/capabilities.json by `python -m polarity verify`.
# Matching is case-insensitive. Example shape (values are placeholders, not real prices):
#
#   "nvidia/example-model-id":
#     input_per_million: null
#     output_per_million: null
#
# Prices entered by the team from the console (2026-10-22); keys match the exact IDs our account sees at
# https://api.tokenfactory.nebius.com/v1/. There is no Nemotron Nano Omni on this account.
models:
  "nvidia/Nemotron-3.5-Super-VL":            # perception (vision)
    input_per_million: 0.3
    output_per_million: 0.9

  "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B":   # fast_text
    input_per_million: 0.06
    output_per_million: 0.24

  "nvidia/nemotron-3-super-120b-a12b":       # reasoning
    input_per_million: 0.3
    output_per_million: 0.9

  "nvidia/Nemotron-3-Ultra-550b-a55b":       # deep
    input_per_million: 1.00
