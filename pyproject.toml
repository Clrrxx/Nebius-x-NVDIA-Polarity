[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polarity"
version = "0.1.0"
description = "An AI lab partner that catches wiring mistakes before the circuit fails, and shows the TA where the class is stuck."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The Polarity Team" }]
requires-python = ">=3.11,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
# Keep in sync with requirements.txt (setup scripts install that file first).
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.2",
  "opencv-contrib-python>=4.8",
  "pyyaml>=6.0",
  "markdown>=3.6",
  "pypdfium2>=4.28",
  "tavily-python>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
audio = ["sounddevice>=0.4"]

[project.scripts]
polarity = "polarity.cli:main"

[tool.setuptools.packages.find]
include = ["polarity*"]

[tool.setuptools.package-data]
polarity = ["web/templates/*.html", "web/static/*/*", "web/static/img/*/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # long prompt strings and docs are clearer unwrapped
  "B008",  # typer.Option(...) in argument defaults is the idiomatic Typer style
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
