name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      POLARITY_MOCK_MODELS: "1"
      POLARITY_MOCK_LATENCY_MS: "0"
      CAMERA_SOURCE: demo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries for OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 || true
      - name: Install
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tests (mock models, demo camera, no network, no secrets)
        run: pytest -q
      - name: Mock eval smoke test
        run: python -m polarity eval --mock
